<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.48" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#081A2C"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="270" y1="60" x2="1120" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.48" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>

    <radialGradient id="orbA">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbB">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur40">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#58A6FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="frame">
      <rect x="18" y="18" width="1364" height="394" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="18" y="18" width="1364" height="394" rx="30" fill="url(#bg)"/>
    <rect x="18" y="18" width="1364" height="394" rx="30" fill="url(#grid)"/>

    <circle cx="230" cy="210" r="210" fill="url(#orbA)" filter="url(#blur40)">
      <animate attributeName="cx" values="180;320;180" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="170;250;170" dur="8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1170" cy="220" r="240" fill="url(#orbB)" filter="url(#blur40)">
      <animate attributeName="cx" values="1190;1060;1190" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;150;250" dur="9s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.32">
      <path d="M0 336C180 290 310 405 510 342C730 272 870 362 1024 323C1165 287 1272 310 1400 260" stroke="url(#blueGlow)" stroke-width="2">
        <animate attributeName="d"
          values="M0 336C180 290 310 405 510 342C730 272 870 362 1024 323C1165 287 1272 310 1400 260;
                  M0 310C180 380 340 274 520 330C730 398 850 268 1040 334C1180 382 1280 270 1400 308;
                  M0 336C180 290 310 405 510 342C730 272 870 362 1024 323C1165 287 1272 310 1400 260"
          dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M0 372C180 326 310 441 510 378C730 308 870 398 1024 359C1165 323 1272 346 1400 296" stroke="#00D4FF" stroke-opacity="0.45" stroke-width="1.5">
        <animate attributeName="d"
          values="M0 372C180 326 310 441 510 378C730 308 870 398 1024 359C1165 323 1272 346 1400 296;
                  M0 350C190 420 340 314 520 370C740 438 860 308 1040 374C1180 422 1280 310 1400 348;
                  M0 372C180 326 310 441 510 378C730 308 870 398 1024 359C1165 323 1272 346 1400 296"
          dur="13s" repeatCount="indefinite"/>
      </path>
    </g>

    <g opacity="0.7">
      <circle cx="90" cy="72" r="2.2" fill="#58A6FF">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1260" cy="84" r="2.6" fill="#00D4FF">
        <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1180" cy="342" r="2" fill="#A78BFA">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="350" r="2.4" fill="#58A6FF">
        <animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(110 95)">
      <rect width="1180" height="240" rx="24" fill="#0D1117" fill-opacity="0.54" stroke="#58A6FF" stroke-opacity="0.22"/>
      <rect x="1" y="1" width="1178" height="238" rx="23" stroke="url(#blueGlow)" stroke-opacity="0.13"/>

      <g transform="translate(34 28)">
        <circle cx="0" cy="0" r="6" fill="#FF5F56"/>
        <circle cx="22" cy="0" r="6" fill="#FFBD2E"/>
        <circle cx="44" cy="0" r="6" fill="#27C93F"/>
        <text x="76" y="5" fill="#8B949E" font-size="15" font-family="monospace">hammad@github: ~/profile</text>
      </g>

      <text x="48" y="96" fill="#8B949E" font-size="19" font-family="monospace">$ identity --resolve</text>

      <text x="48" y="154" fill="white" font-size="58" font-weight="800" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">
        HAMMAD ASHER
      </text>

      <rect x="48" y="174" width="890" height="3" rx="2" fill="url(#blueGlow)" filter="url(#glow)">
        <animate attributeName="width" values="120;890;120" dur="8s" repeatCount="indefinite"/>
      </rect>

      <text x="48" y="215" fill="#C9D1D9" font-size="20" font-family="monospace">
        SOFTWARE ENGINEER  •  AI SYSTEMS  •  MLOPS  •  BACKEND ARCHITECTURE
      </text>

      <g transform="translate(1010 82)">
        <circle cx="52" cy="52" r="52" fill="#0D1117" stroke="#58A6FF" stroke-width="2" stroke-opacity="0.5"/>
        <circle cx="52" cy="52" r="40" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="8 9">
          <animateTransform attributeName="transform" type="rotate" from="0 52 52" to="360 52 52" dur="8s" repeatCount="indefinite"/>
        </circle>
        <path d="M28 58L45 75L78 35" stroke="#58A6FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <text x="52" y="126" text-anchor="middle" fill="#8B949E" font-size="12" font-family="monospace">SYSTEM ONLINE</text>
      </g>
    </g>

    <rect x="18.5" y="18.5" width="1363" height="393" rx="29.5" stroke="url(#blueGlow)" stroke-opacity="0.6"/>
    <rect x="18.5" y="18.5" width="1363" height="393" rx="29.5" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
